registry: configs/catalog/registry.yaml
cases: data/eval/baking-v1.0/test.jsonl
report_dir: reports/generated/baking-search-v1
# Both models use the identical frozen cases file. CLI selects one model per run.
backends:
  baking-qwen3-0.6b: configs/inference/baking-qwen3-0.6b.yaml
  baking-qwen3-1.7b: configs/inference/baking-qwen3-1.7b.yaml
scorers: [schema, assertions, patch]
# Hard acceptance gates from the migration plan, not claimed baseline results.
thresholds:
  schema_valid: 1.0
  allergen_semantics: 1.0
  no_unknown_field: 1.0
  no_unknown_value: 1.0
