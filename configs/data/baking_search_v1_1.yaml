dataset_id: baking-raw-v1.1
registry_path: configs/catalog/registry.yaml
output_dir: data/raw/baking-v1.1
output_root: data
version: baking-v1.1
enable_dpo: false
val_fraction: 0.1
eval_path: data/eval/baking-v1.0/test.jsonl
split: train
seed: 42
generation_concurrency: 5
max_attempts: 3
max_duplicate_retries: 3
generate_inference_config: configs/inference/openai_responses_gpt_5.6_sol.yaml
counts:
  single_filter: 120
  multi_filter: 200
  hard_soft_mix: 220
  negation: 150
  allergy_vs_flavor: 180
  replace: 180
  clear: 120
  preserve_state: 150
  numeric_price: 120
  numeric_size: 80
  relative_numeric: 80
  sort: 60
  query_text: 40
  unmapped: 80
  reset: 40
planning:
  enabled: true
  languages: [zh, en, mixed]
  styles: [statement, question, colloquial]
  orders: [forward, reverse, shuffled]
  numeric_pools:
    price: [0, 5, 9, 12.5, 15, 20, 25, 35, 50, 75]
    size: [0.5, 1, 2, 8, 16, 100, 250, 500]
    sweetness_level: [1, 2, 3, 4, 5]
    flavor_intensity: [1, 2, 3, 4, 5]
  currencies: [null, USD, EUR, CNY]
  # Free-text candidates need semantic review; they are not new Registry enums.
  free_text_review_status: ai_drafted_pending_human_review
  query_terms:
    - Atelier collection
    - Weekend special
    - Celebration edition
    - Seasonal signature
    - Cafe exclusive
    - Festival collection
    - Limited edition
    - Heritage series
    - Picnic collection
    - Boutique selection
    - Celebration series
    - Weekend edition
  unmapped_terms:
    - 高级一点
    - 包装有仪式感
    - 看起来更精致
    - 适合拍照
    - 有节日气氛
    - 视觉上有层次
    - 有故事感
    - 包装更有设计感
diversity:
  min_field_combinations: 10
  min_semantic_unique_ratio: 0.8
  value_share_slack: 0.1
