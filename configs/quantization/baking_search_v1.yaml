version: baking-search-v1
registry_profile: baking_search
threads: 8
context_size: 8192
work_root: models/quantization/baking-search-v1
# Prepare from reviewed SFT train only; never use Frozen Eval or validation data.
calibration_data: data/calibration/baking-search-v1.txt
toolchain:
  resolve: huggingface-cli
  merge: llamafactory-cli
  convert_f16: deployment/llama_cpp/source/convert_hf_to_gguf.py
  imatrix: deployment/llama_cpp/bin/llama-imatrix.exe
  quantize: deployment/llama_cpp/bin/llama-quantize.exe
  server: deployment/llama_cpp/bin/llama-server.exe
models:
  - &sft06
    model_id: baking-search-qwen3-0.6b-sft-v1-q4-k-m
    family: qwen3
    size_b: 0.6
    stage: sft
    variant: sft-v1
    base_model: Qwen/Qwen3-0.6B
    base_revision: main
    adapter_run_id: baking-qwen3-0.6b
    adapter_path: models/adapters/baking-search-qwen3-0.6b-sft-v1
    artifact_kind: q4_k_m
    artifact_path: models/gguf/baking-search-qwen3-0.6b-sft-v1-q4-k-m.gguf
    manifest_path: models/quantization/baking-search-v1/baking-search-qwen3-0.6b-sft-v1-q4-k-m/manifest.json
    is_anchor: false
    server_args: [--ctx-size, '12288', --parallel, '1', --alias, baking-search-qwen3-0.6b-sft-v1-q4-k-m]
  - &sft17
    model_id: baking-search-qwen3-1.7b-sft-v1-q4-k-m
    family: qwen3
    size_b: 1.7
    stage: sft
    variant: sft-v1
    base_model: Qwen/Qwen3-1.7B
    base_revision: main
    adapter_run_id: baking-qwen3-1.7b
    adapter_path: models/adapters/baking-search-qwen3-1.7b-sft-v1
    artifact_kind: q4_k_m
    artifact_path: models/gguf/baking-search-qwen3-1.7b-sft-v1-q4-k-m.gguf
    manifest_path: models/quantization/baking-search-v1/baking-search-qwen3-1.7b-sft-v1-q4-k-m/manifest.json
    is_anchor: false
    server_args: [--ctx-size, '12288', --parallel, '1', --alias, baking-search-qwen3-1.7b-sft-v1-q4-k-m]
  - <<: *sft06
    model_id: baking-search-qwen3-0.6b-sft-v1-f16
    artifact_kind: f16
    artifact_path: models/merged/baking-search-qwen3-0.6b-sft-v1-f16/model-f16.gguf
    manifest_path: models/merged/baking-search-qwen3-0.6b-sft-v1-f16/manifest.json
    is_anchor: true
    server_args: [--ctx-size, '12288', --parallel, '1', --alias, baking-search-qwen3-0.6b-sft-v1-f16]
  - <<: *sft17
    model_id: baking-search-qwen3-1.7b-sft-v1-f16
    artifact_kind: f16
    artifact_path: models/merged/baking-search-qwen3-1.7b-sft-v1-f16/model-f16.gguf
    manifest_path: models/merged/baking-search-qwen3-1.7b-sft-v1-f16/manifest.json
    is_anchor: true
    server_args: [--ctx-size, '12288', --parallel, '1', --alias, baking-search-qwen3-1.7b-sft-v1-f16]
